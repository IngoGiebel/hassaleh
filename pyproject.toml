[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hassaleh"
version = "0.1.0"
description = "Graph-native agentic framework — everything lives in Neo4j"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Ingo Giebel" },
    { name = "Dione", email = "dione@alpha-auriga.com" },
]

dependencies = [
    "neo4j>=5.0",
    "aiohttp>=3.9",
    "lark>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hassaleh = "hassaleh.cli:main"
hassaleh-daemon = "hassaleh.daemon:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: Integration tests requiring running Neo4j (deselect with '-m not integration')",
]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/hassaleh"]
